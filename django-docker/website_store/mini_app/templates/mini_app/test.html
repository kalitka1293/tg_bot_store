<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Плавное выпадающее меню</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background: #fff7f0;
      color: #333;
    }

    .container {
      max-width: 220px;
    }

    /* Кнопка */
    .button {
      display: inline-block;
      padding: 0.5em 1em;
      font-size: 1rem;
      cursor: pointer;
      background-color: #f5cac3;
      border: none;
      border-radius: 4px;
      color: #333;
      user-select: none;
      transition: background-color 0.3s;
    }
    .button:hover,
    .button:focus {
      background-color: #e3b3a1;
      outline: none;
    }

    /* Меню */
    .menu {
      margin-top: 0.5rem;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.5s ease, padding 0.5s ease;
      padding-left: 0;
      list-style: none;
      border-left: 3px solid #f5cac3;
    }

    /* Активное меню - раскрыто */
    .button.active + .menu {
      max-height: 500px; /* достаточно большое значение для всех пунктов */
      padding-left: 1em;
    }

    /* Пункты меню */
    .menu-item {
      margin: 0.3em 0;
    }

    .menu-link {
      text-decoration: none;
      color: #333;
      display: block;
      padding: 0.3em 0.5em;
      border-radius: 3px;
      transition: background-color 0.3s;
    }

    .menu-link:hover,
    .menu-link:focus {
      background-color: #f5cac3;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="button" aria-expanded="false" aria-controls="dropdown-menu" id="dropdown-button">
      Меню
    </button>
    <ul class="menu" id="dropdown-menu" aria-hidden="true">
      <li class="menu-item">
        <a href="#" class="menu-link" tabindex="-1">Винни-Пух</a>
      </li>
      <li class="menu-item">
        <a href="#" class="menu-link" tabindex="-1">Тигра</a>
      </li>
      <li class="menu-item">
        <a href="#" class="menu-link" tabindex="-1">Пятачок</a>
      </li>
    </ul>
  </div>

  <script>
    const button = document.getElementById('dropdown-button');
    const menu = document.getElementById('dropdown-menu');

    button.addEventListener('click', () => {
      const expanded = button.classList.toggle('active');
      button.setAttribute('aria-expanded', expanded);
      menu.setAttribute('aria-hidden', !expanded);

      // Управляем доступностью ссылок
      const links = menu.querySelectorAll('.menu-link');
      links.forEach(link => {
        link.tabIndex = expanded ? 0 : -1;
      });
    });
  </script>
</body>
</html>
